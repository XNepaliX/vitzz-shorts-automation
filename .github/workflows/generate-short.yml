name: Generate vitzz Short

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Short topic"
        required: true
        default: "A strange fact about the human brain"
      script:
        description: "Optional voiceover script"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "main.py"
      - ".github/workflows/generate-short.yml"
      - "requirements.txt"
  schedule:
    - cron: "15 12 * * 1,3,5"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      SHORT_TOPIC: ${{ github.event.inputs.topic || 'A strange fact about the human brain' }}
      SHORT_SCRIPT: ${{ github.event.inputs.script }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Generate Short
        run: python main.py
      - name: Verify video output
        run: |
          test -s output/vitzz-short.mp4
          ffprobe -v error -show_entries stream=codec_name,width,height -of json output/vitzz-short.mp4
          test -s output/captions.srt
      - name: Upload video artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitzz-short
          path: output/
          if-no-files-found: warn
          retention-days: 7
