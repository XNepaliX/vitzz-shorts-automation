name: Generate animated Short

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Short topic"
        required: true
        default: "What your brain does while you sleep"
      script:
        description: "Optional voiceover script"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "main.py"
      - ".github/workflows/generate-short.yml"
      - "requirements.txt"
  schedule:
    - cron: "15 12 * * 1,3,5"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SHORT_TOPIC: ${{ github.event.inputs.topic || 'What your brain does while you sleep' }}
      SHORT_SCRIPT: ${{ github.event.inputs.script }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Generate animated video
        run: python main.py
      - name: Verify 60-second vertical MP4 and captions
        run: |
          test -s output/short.mp4
          test -s output/captions.srt
          python - <<'PY'
          import json, subprocess
          data = json.loads(subprocess.check_output([
              "ffprobe", "-v", "error", "-show_entries",
              "format=duration:stream=width,height,codec_name",
              "-of", "json", "output/short.mp4"
          ], text=True))
          video = next(s for s in data["streams"] if s.get("codec_name") == "h264")
          duration = float(data["format"]["duration"])
          assert video["width"] == 1080 and video["height"] == 1920, video
          assert 59.5 <= duration <= 60.5, duration
          print(f"Verified: {duration:.2f}s, {video['width']}x{video['height']}, H.264")
          PY
      - name: Upload finished video and captions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: animated-short
          path: output/
          if-no-files-found: warn
          retention-days: 7
